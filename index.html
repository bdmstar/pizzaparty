<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Recital Program</title>
    <style>
        /* 가로 스크롤 방지 */
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 헤더 반응형 레이아웃 */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            /* Program 글자 대신 굵은 선으로 구분감 부여 */
            border-bottom: 3px solid #000;
            padding-bottom: 25px;
            text-align: center;
        }

        @media (min-width: 600px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
                text-align: left;
            }
        }

        h1 {
            font-size: 28px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-selector select {
            padding: 8px 12px;
            font-size: 14px;
            font-family: serif;
            border: 1px solid #000;
            background-color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        /* 프로그램 아이템 */
        .program-item {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px dotted #ccc;
        }
        .program-item:last-child {
            border-bottom: none;
        }

        .composer {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .piece {
            font-size: 16px;
            font-weight: 600;
            margin-left: 10px;
        }
        .movement {
            font-size: 13px;
            color: #666;
            font-style: italic;
            margin-left: 10px;
            margin-top: 5px;
            display: block;
            white-space: pre-wrap;
        }
        .performer-row {
            text-align: right;
            margin-top: 12px;
        }
        .performer-name {
            font-size: 13px;
            font-weight: bold;
            background-color: #f4f4f4;
            padding: 5px 12px;
            border-radius: 4px;
            display: inline-block;
        }

        /* [핵심] 인터미션: 화면 가로 끝까지 꽉 채우기 */
        .intermission-bar {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 30px 0;
            margin: 50px 0;
            font-style: italic;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 8px;
            text-transform: uppercase;

            /* 컨테이너의 padding을 무시하고 화면 끝까지 늘리는 마법 */
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }

        footer {
            text-align: center;
            margin: 60px 0 40px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🍕 PIANO RECITAL 🍕</h1>
            </div>
            <div class="date-selector">
                <select id="dateSelect" onchange="showConcert(this.value)"></select>
            </div>
        </header>

        <div id="concertContent"></div>
        
        <footer>Thank you for attending our recital.</footer>
    </div>

    <script>
        let concertData = [];

        function formatMovement(movement) {
            if (!movement) return '';
            if (Array.isArray(movement)) return movement.join('\n');
            return movement;
        }

        async function loadConcerts() {
            try {
                const response = await fetch('./concerts.json');
                const data = await response.json();
                concertData = data.concerts;
                concertData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderDateSelector();
                showConcert(0);
            } catch (error) {
                console.error('데이터 로드 실패:', error);
            }
        }

        function renderDateSelector() {
            const selectElement = document.getElementById('dateSelect');
            selectElement.innerHTML = '';
            concertData.forEach((concert, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = concert.dateDisplay;
                selectElement.appendChild(option);
            });
        }

        function showConcert(index) {
            const concert = concertData[index];
            const contentContainer = document.getElementById('concertContent');
            
            let html = '';
            concert.programs.forEach((program) => {
                if (program.intermission) {
                    html += `<div class="intermission-bar">INTERMISSION</div>`;
                    return;
                }

                html += '<div class="program-item">';
                if (program.works && program.works.length > 0) {
                    program.works.forEach((work) => {
                        html += '<div class="work-section">';
                        html += `<div class="composer">${work.composer}</div>`;
                        html += `<div class="piece">${work.piece}</div>`;
                        if (work.movement) {
                            html += `<div class="movement">${formatMovement(work.movement)}</div>`;
                        }
                        html += '</div>';
                    });
                } else {
                    html += `<div class="composer">${program.composer}</div>`;
                    html += `<div class="piece">${program.piece}</div>`;
                    if (program.movement) {
                        html += `<div class="movement">${formatMovement(program.movement)}</div>`;
                    }
                }
                // 백틱(`)을 사용하여 Pf. 변수가 정상 출력되도록 수정
                html += `<div class="performer-row"><span class="performer-name">Pf. ${program.performer}</span></div>`;
                html += '</div>';
            });

            contentContainer.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadConcerts);
    </script>
</body>
</html>
