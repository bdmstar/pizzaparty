<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Recital Program</title>
    <style>
        /* 기본 설정 */
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* 헤더 */
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
        }

        /* 날짜 선택 드롭다운 (오른쪽 위 구석) */
        .date-selector {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .date-selector select {
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f4f4f4;
            cursor: pointer;
            font-family: inherit;
        }

        .date-selector select:hover {
            background-color: #e0e0e0;
        }

        /* 프로그램 아이템 */
        .program-item {
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 1px dotted #ccc;
        }
        
        .program-item:last-child {
            border-bottom: none;
        }

        .composer {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .piece {
            font-size: 15px;
            font-weight: 600;
            margin: 3px 0;
        }

        .movement {
            font-size: 13px;
            color: #666;
            font-style: italic;
            margin-bottom: 10px;
        }

        /* 연주자 이름 */
        .performer-row {
            text-align: right;
            margin-top: 8px;
        }

        .performer-name {
            font-size: 13px;
            font-weight: bold;
            color: #000;
            background-color: #f4f4f4;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 12px;
            color: #888;
            padding-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="date-selector">
            <select id="dateSelect" onchange="showConcert(this.value)">
                <!-- 옵션은 JavaScript로 동적 생성 -->
            </select>
        </div>

        <header>
            <h1>Piano Recital</h1>
            <div class="subtitle">Program</div>
        </header>

        <div id="concertContent"></div>

        <footer>
            Thank you for attending.
        </footer>
    </div>

    <script>
        let concertData = [];

        // concerts.json 로드
        async function loadConcerts() {
            try {
                const response = await fetch('./concerts.json');
                const data = await response.json();
                concertData = data.concerts;
                
                // 날짜 역순 정렬 (최신순)
                concertData.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                renderDateSelector();
                // 기본으로 가장 최근 날짜(첫번째) 표시
                showConcert(0);
            } catch (error) {
                console.error('Error loading concerts:', error);
            }
        }

        // 날짜 선택 드롭다운 렌더링
        function renderDateSelector() {
            const selectElement = document.getElementById('dateSelect');
            selectElement.innerHTML = '';

            concertData.forEach((concert, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = concert.dateDisplay;
                selectElement.appendChild(option);
            });
        }

        // 콘서트 내용 렌더링
        function showConcert(index) {
            const concert = concertData[index];
            const contentContainer = document.getElementById('concertContent');
            
            // 드롭다운 선택 상태 업데이트
            document.getElementById('dateSelect').value = index;

            // 콘텐츠 생성
            let html = '';
            concert.programs.forEach((program) => {
                html += `
                    <div class="program-item">
                        <div class="composer">${program.composer}</div>
                        <div class="piece">${program.piece}</div>
                        ${program.movement ? `<div class="movement">${program.movement}</div>` : ''}
                        <div class="performer-row">
                            <span class="performer-name">Pf. ${program.performer}</span>
                        </div>
                    </div>
                `;
            });

            contentContainer.innerHTML = html;
        }

        // 페이지 로드 시 concerts 로드
        window.addEventListener('DOMContentLoaded', loadConcerts);
    </script>

</body>
</html>
