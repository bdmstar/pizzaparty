<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Recital Program</title>
    <style>
        /* 기본 설정 */
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 탭 컨테이너 */
        .tab-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 헤더 */
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
        }

        /* 탭 버튼 스타일 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            border-bottom: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background-color: #e0e0e0;
        }

        .tab-btn.active {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }

        /* 콘텐츠 표시 */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 섹션 타이틀 */
        .section-wrapper {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #000;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* 프로그램 아이템 */
        .program-item {
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 1px dotted #ccc;
        }
        
        .program-item:last-child {
            border-bottom: none;
        }

        .order {
            font-size: 12px;
            font-weight: bold;
            color: #666;
            margin-bottom: 3px;
        }

        .composer {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .piece {
            font-size: 15px;
            font-weight: 600;
            margin: 3px 0;
        }

        .movement {
            font-size: 13px;
            color: #666;
            font-style: italic;
            margin-bottom: 10px;
        }

        /* 연주자 이름 */
        .performer-row {
            text-align: right;
            margin-top: 8px;
        }

        .performer-name {
            font-size: 13px;
            font-weight: bold;
            color: #000;
            background-color: #f4f4f4;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 12px;
            color: #888;
            padding-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="tab-container">
        <header>
            <h1>Piano Recital</h1>
            <div class="subtitle">Program</div>
        </header>

        <!-- 탭 버튼들 -->
        <div class="tabs" id="tabButtons"></div>

        <!-- 탭 콘텐츠 -->
        <div id="tabContents"></div>

        <footer>
            Thank you for attending.
        </footer>
    </div>

    <script>
        let concertData = [];
        let currentTab = 0;

        // concerts.json 로드
        async function loadConcerts() {
            try {
                const response = await fetch('concerts.json');
                const data = await response.json();
                concertData = data.concerts;
                renderTabs();
                showConcert(0);
            } catch (error) {
                console.error('Error loading concerts:', error);
            }
        }

        // 탭 버튼 렌더링
        function renderTabs() {
            const tabButtonsContainer = document.getElementById('tabButtons');
            tabButtonsContainer.innerHTML = '';

            concertData.forEach((concert, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
                btn.textContent = concert.dateDisplay;
                btn.onclick = () => showConcert(index);
                tabButtonsContainer.appendChild(btn);
            });
        }

        // 콘텐츠 렌더링
        function showConcert(index) {
            currentTab = index;
            const concert = concertData[index];
            const tabContentsContainer = document.getElementById('tabContents');
            
            // 탭 버튼 활성화 상태 업데이트
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            // 콘텐츠 생성
            let html = '';
            concert.programs.forEach((program) => {
                html += `
                    <div class="program-item">
                        <div class="order">No. ${program.order} [${program.performer}]</div>
                        <div class="composer">${program.composer}</div>
                        <div class="piece">${program.piece}</div>
                        ${program.movement ? `<div class="movement">${program.movement}</div>` : ''}
                        <div class="performer-row">
                            <span class="performer-name">Pf. ${program.performer}</span>
                        </div>
                    </div>
                `;
            });

            tabContentsContainer.innerHTML = html;
        }

        // 페이지 로드 시 concerts 로드
        window.addEventListener('DOMContentLoaded', loadConcerts);
    </script>

</body>
</html>
