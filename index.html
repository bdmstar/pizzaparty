<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Recital Program</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* [수정] 헤더: 모바일 대응 및 화려한 타이틀 */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
            border-bottom: 3px double #000; /* 이중선으로 고급스럽게 */
            padding-bottom: 30px;
            text-align: center;
        }

        /* 데스크톱 모드: 제목과 선택창 양옆 배치 */
        @media (min-width: 600px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
                text-align: left;
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            margin: 0;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .date-selector select {
            padding: 8px 15px;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            font-weight: bold;
            border: 1.5px solid #000;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .date-selector select:hover {
            background-color: #000;
            color: #fff;
        }

        /* 프로그램 아이템 스타일 */
        .program-item {
            margin-bottom: 45px;
            padding-bottom: 15px;
        }
        .work-section {
            margin-bottom: 18px;
        }
        .composer {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .piece {
            font-size: 16px;
            font-weight: 700;
            margin-left: 12px;
        }
        .movement {
            font-size: 13.5px;
            color: #555;
            font-style: italic;
            margin-left: 12px;
            margin-top: 6px;
            display: block;
            white-space: pre-wrap; /* 줄바꿈 적용 핵심 */
        }
        .performer-row {
            text-align: right;
            margin-top: 10px;
        }
        .performer-name {
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #000;
            padding: 3px 12px;
            display: inline-block;
        }

        /* [수정] 인터미션: 검은 상자 + 화이트 라인 효과 */
        .intermission-bar {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin: 60px 0;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 10px;
            text-transform: uppercase;
            position: relative;
            /* 상하 내부 선 효과 */
            border-top: 1px solid rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 0 5px #000; /* 바깥쪽 두께감 */
        }

        footer {
            text-align: center;
            margin: 80px 0 40px;
            font-size: 11px;
            color: #aaa;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Piano Recital</h1>
                <div style="font-size: 14px; color: #666; margin-top: 8px; letter-spacing: 1px;">PROGRAMME</div>
            </div>
            <div class="date-selector">
                <select id="dateSelect" onchange="showConcert(this.value)"></select>
            </div>
        </header>

        <div id="concertContent"></div>
        
        <footer>&copy; 2025-2026 Piano Series. All rights reserved.</footer>
    </div>

    <script>
        let concertData = [];

        function formatMovement(movement) {
            if (!movement) return '';
            if (Array.isArray(movement)) return movement.join('\n');
            return movement;
        }

        async function loadConcerts() {
            try {
                // 실제 환경에서는 './concerts.json' 경로를 확인하세요.
                const response = await fetch('./concerts.json');
                const data = await response.json();
                concertData = data.concerts;
                // 날짜 내림차순 정렬
                concertData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderDateSelector();
                showConcert(0);
            } catch (error) {
                console.error('데이터를 불러오는데 실패했습니다:', error);
            }
        }

        function renderDateSelector() {
            const selectElement = document.getElementById('dateSelect');
            selectElement.innerHTML = '';
            concertData.forEach((concert, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = concert.dateDisplay;
                selectElement.appendChild(option);
            });
        }

        function showConcert(index) {
            const concert = concertData[index];
            const contentContainer = document.getElementById('concertContent');
            document.getElementById('dateSelect').value = index;

            let html = '';
            concert.programs.forEach((program) => {
                // 인터미션 바 처리
                if (program.intermission) {
                    html += `<div class="intermission-bar">Intermission</div>`;
                    return;
                }

                html += '<div class="program-item">';
                if (program.works && program.works.length > 0) {
                    program.works.forEach((work) => {
                        html += '<div class="work-section">';
                        html += `<div class="composer">${work.composer}</div>`;
                        html += `<div class="piece">${work.piece}</div>`;
                        if (work.movement) {
                            html += `<div class="movement">${formatMovement(work.movement)}</div>`;
                        }
                        html += '</div>';
                    });
                } else {
                    html += `<div class="composer">${program.composer}</div>`;
                    html += `<div class="piece">${program.piece}</div>`;
                    if (program.movement) {
                        html += `<div class="movement">${formatMovement(program.movement)}</div>`;
                    }
                }
                html += '<div class="performer-row"><span class="performer-name">Pf. ${program.performer}</span></div>';
                html += '</div>';
            });

            contentContainer.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadConcerts);
    </script>
</body>
</html>
