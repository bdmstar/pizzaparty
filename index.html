<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Recital Program</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* [핵심] 헤더 반응형 레이아웃: 모바일 겹침 방지 */
        header {
            display: flex;
            flex-direction: column; /* 모바일: 위아래 배치 */
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
            text-align: center;
        }

        /* 데스크톱(너비 600px 이상): 양옆으로 배치 */
        @media (min-width: 600px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
                text-align: left;
            }
        }

        h1 {
            font-size: 26px;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .date-selector select {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f4f4f4;
            cursor: pointer;
        }

        /* 프로그램 리스트 스타일 */
        .program-item {
            margin-bottom: 35px;
            padding-bottom: 15px;
            border-bottom: 1px dotted #ccc;
        }
        .program-item:last-child {
            border-bottom: none;
        }
        .work-section {
            margin-bottom: 15px;
        }
        .composer {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .piece {
            font-size: 15px;
            font-weight: 600;
            margin-left: 10px;
        }
        .movement {
            font-size: 13px;
            color: #666;
            font-style: italic;
            margin-left: 10px;
            margin-top: 5px;
            display: block;
            /* [핵심] 줄바꿈(\n) 적용 */
            white-space: pre-wrap; 
        }
        .performer-row {
            text-align: right;
            margin-top: 8px;
        }
        .performer-name {
            font-size: 13px;
            font-weight: bold;
            background-color: #f4f4f4;
            padding: 4px 10px;
            border-radius: 4px;
            display: inline-block;
        }

        /* [핵심] 인터미션: 두꺼운 검은 상자 바 */
        .intermission-bar {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin: 40px 0;
            font-style: italic;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;
            display: block;
            width: 100%;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🍕 Piano Recital 🍕</h1>
                <div style="font-size: 14px; color: #555; margin-top: 5px;">Program</div>
            </div>
            <div class="date-selector">
                <select id="dateSelect" onchange="showConcert(this.value)"></select>
            </div>
        </header>

        <div id="concertContent"></div>
        
        <footer>Thank you for attending.</footer>
    </div>

    <script>
        let concertData = [];

        // 줄바꿈 처리를 위한 헬퍼 함수
        function formatMovement(movement) {
            if (!movement) return '';
            if (Array.isArray(movement)) return movement.join('\n');
            return movement;
        }

        async function loadConcerts() {
            try {
                const response = await fetch('./concerts.json');
                const data = await response.json();
                concertData = data.concerts;
                // 날짜 기준 정렬 (최신순)
                concertData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderDateSelector();
                showConcert(0);
            } catch (error) {
                console.error('데이터 로드 실패:', error);
            }
        }

        function renderDateSelector() {
            const selectElement = document.getElementById('dateSelect');
            selectElement.innerHTML = '';
            concertData.forEach((concert, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = concert.dateDisplay;
                selectElement.appendChild(option);
            });
        }

        function showConcert(index) {
            const concert = concertData[index];
            const contentContainer = document.getElementById('concertContent');
            document.getElementById('dateSelect').value = index;

            let html = '';
            concert.programs.forEach((program) => {
                // 인터미션 처리
                if (program.intermission) {
                    html += `<div class="intermission-bar">INTERMISSION</div>`;
                    return;
                }

                html += '<div class="program-item">';
                if (program.works && program.works.length > 0) {
                    program.works.forEach((work) => {
                        html += '<div class="work-section">';
                        html += `<div class="composer">${work.composer}</div>`;
                        html += `<div class="piece">${work.piece}</div>`;
                        if (work.movement) {
                            html += `<div class="movement">${formatMovement(work.movement)}</div>`;
                        }
                        html += '</div>';
                    });
                } else {
                    html += `<div class="composer">${program.composer}</div>`;
                    html += `<div class="piece">${program.piece}</div>`;
                    if (program.movement) {
                        html += `<div class="movement">${formatMovement(program.movement)}</div>`;
                    }
                }
                html += `<div class="performer-row"><span class="performer-name">Pf. ${program.performer}</span></div>`;
                html += '</div>';
            });

            contentContainer.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadConcerts);
    </script>
</body>
</html>
