<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Recital Program</title>
    <style>
        /* 1. 기본 레이아웃 및 초기화 */
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: 'Times New Roman', Times, serif;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 25px;
            box-sizing: border-box;
        }

        /* 2. 헤더 스타일: 타이포그래피 및 상단 실선 */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 60px; /* 실선에서 첫 프로그램까지의 거리: 60px */
            border-bottom: 3px solid #000;
            padding-bottom: 30px;
            text-align: center;
        }

        @media (min-width: 600px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
                text-align: left;
            }
        }

        h1 {
            font-size: 22px;
            margin: 0;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            font-weight: 400;
        }

        .date-selector select {
            padding: 5px 10px;
            font-size: 13px;
            font-family: serif;
            border: 1px solid #000;
            background-color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 3. 프로그램 아이템 스타일 */
        .program-item {
            margin-bottom: 50px;
            padding-bottom: 25px;
            border-bottom: 1px dotted #bbb;
        }

        /* 인터미션 직전의 아이템은 점선을 제거 */
        .program-item:has(+ .intermission-bar) {
            border-bottom: none;
        }

        /* [수정] 마지막 아이템 밑에는 상단과 대칭되는 여백과 두꺼운 실선 추가 */
        #concertContent > .program-item:last-of-type {
            border-bottom: 3px solid #000;
            padding-bottom: 60px; /* 상단 헤더의 margin-bottom인 60px과 동일하게 맞춤 */
            margin-bottom: 0;
        }

        /* 4. 세부 텍스트 스타일 */
        .composer {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            display: block;
        }

        .piece {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .movement {
            font-size: 14px;
            color: #555;
            font-style: italic;
            margin-left: 15px;
            margin-top: 6px;
            display: block;
            white-space: pre-wrap;
        }

        /* [수정] 연주자 정보: 밑줄 제거 */
        .performer-row {
            text-align: right;
            margin-top: 15px;
        }

        .performer-name {
            font-size: 14px;
            font-weight: bold;
            font-style: italic;
            /* border-bottom 제거됨 */
            display: inline-block;
        }

        /* 5. 인터미션 스타일 */
        .intermission-bar {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 25px 0;
            margin: 60px 0;
            font-style: italic;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 10px;
            text-transform: uppercase;
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
        }

        footer {
            text-align: center;
            margin: 80px 0 60px;
            font-size: 11px;
            color: #aaa;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🍕 PIANO RECITAL 🍕</h1>
            </div>
            <div class="date-selector">
                <select id="dateSelect" onchange="showConcert(this.value)"></select>
            </div>
        </header>

        <div id="concertContent"></div>
        
        <footer>Thank you for attending our recital.</footer>
    </div>

    <script>
        let concertData = [];

        function formatMovement(movement) {
            if (!movement) return '';
            if (Array.isArray(movement)) return movement.join('\n');
            return movement;
        }

        async function loadConcerts() {
            try {
                const response = await fetch('./concerts.json');
                const data = await response.json();
                concertData = data.concerts;
                concertData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderDateSelector();
                showConcert(0);
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                // 테스트용 로컬 데이터 (백업용)
                /*
                concertData = [{
                    dateDisplay: "2026. 03. 23",
                    programs: [
                        { composer: "L. v. Beethoven", piece: "Piano Sonata No. 14 'Moonlight'", movement: ["I. Adagio sostenuto", "II. Allegretto", "III. Presto agitato"], performer: "Hong Gil Dong" },
                        { intermission: true },
                        { composer: "F. Chopin", piece: "Ballade No. 1 in G Minor, Op. 23", performer: "Hong Gil Dong" }
                    ]
                }];
                renderDateSelector();
                showConcert(0);
                */
            }
        }

        function renderDateSelector() {
            const selectElement = document.getElementById('dateSelect');
            selectElement.innerHTML = '';
            concertData.forEach((concert, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = concert.dateDisplay;
                selectElement.appendChild(option);
            });
        }

        function showConcert(index) {
            const concert = concertData[index];
            const contentContainer = document.getElementById('concertContent');
            
            let html = '';
            concert.programs.forEach((program) => {
                if (program.intermission) {
                    html += `<div class="intermission-bar">INTERMISSION</div>`;
                    return;
                }

                html += '<div class="program-item">';
                if (program.works && program.works.length > 0) {
                    program.works.forEach((work) => {
                        html += '<div class="work-section" style="margin-bottom: 20px;">';
                        html += `<div class="composer">${work.composer}</div>`;
                        html += `<div class="piece">${work.piece}</div>`;
                        if (work.movement) {
                            html += `<div class="movement">${formatMovement(work.movement)}</div>`;
                        }
                        html += '</div>';
                    });
                } else {
                    html += `<div class="composer">${program.composer}</div>`;
                    html += `<div class="piece">${program.piece}</div>`;
                    if (program.movement) {
                        html += `<div class="movement">${formatMovement(program.movement)}</div>`;
                    }
                }
                html += `<div class="performer-row"><span class="performer-name">Pf. ${program.performer}</span></div>`;
                html += '</div>';
            });

            contentContainer.innerHTML = html;
        }

            window.addEventListener('DOMContentLoaded', loadConcerts);
    </script>
</body>
</html>
